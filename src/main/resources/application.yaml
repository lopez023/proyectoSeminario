spring:
  application:
    name: ReporteAsistencia

  datasource:
    url: jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?user=postgres.urfkbmnidjyngjxwabus&password=8tu3ER59S6EY0vLo&prepareThreshold=0&preferQueryMode=extendedForPreparedStatements

    driver-class-name: org.postgresql.Driver


  hikari:
    maximum-pool-size: 10
    minimum-idle: 2
    idle-timeout: 60000          # 1 minuto
    max-lifetime: 300000         # 5 minutos (evita mantener conexiones muertas)
    keepalive-time: 30000        # Revisa activamente la salud de las conexiones
    connection-timeout: 20000    # 20 segundos
    connection-test-query: SELECT 1


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

